[project]
name = "posesense"
version = "0.1.0"
description = "Real-time human pose recognition and custom pose trainer using MediaPipe and scikit-learn"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "TheChippHimself", email = "millaresbermilshabach@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "pandas-stubs>=2.2.0",
]

[project.scripts]
posesense = "posesense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posesense"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["posesense"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mediapipe.*",
    "sklearn.*",
    "joblib.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests requiring webcam or display (deselect with '-m \"not hardware\"')",
    "slow: tests that take a long time to run",
]
addopts = "-m 'not hardware' --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning:mediapipe.*",
]

[tool.coverage.run]
source = ["posesense"]
omit = [
    "src/posesense/ui/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]
