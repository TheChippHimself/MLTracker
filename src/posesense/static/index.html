<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PoseSense VRM Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #00ff00; } /* Chroma key green */
        canvas { display: block; }
        #status { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;}
    </style>
    <!-- Basic Three.js -->
    <script src="https://unpkg.com/three@0.133.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.133.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Three VRM -->
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>
    <!-- Kalidokit -->
    <script src="https://unpkg.com/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head>
<body>
    <div id="status">Connecting...</div>
    <script>
        const statusEl = document.getElementById("status");

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.0, 5.0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0.0, 1.0, 0.0);
        controls.update();

        let currentVrm = null;

        fetch('/config').then(res => res.json()).then(config => {
            if(config.vrm_file) {
                statusEl.innerText = "Loading VRM: " + config.vrm_file;
                const loader = new THREE.GLTFLoader();
                loader.crossOrigin = 'anonymous';
                loader.load(
                    '/' + encodeURIComponent(config.vrm_file),
                    (gltf) => {
                        THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
                        THREE.VRM.from(gltf).then((vrm) => {
                            scene.add(vrm.scene);
                            currentVrm = vrm;
                            currentVrm.scene.rotation.y = Math.PI; 
                            statusEl.innerText = "VRM Loaded. Waiting for poses...";
                        });
                    },
                    (progress) => {},
                    (error) => {
                        console.error(error);
                        statusEl.innerText = "Failed to load VRM. Check console.";
                    }
                );
            } else {
                statusEl.innerText = "No VRM file specified!";
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (currentVrm) {
                currentVrm.update(clock.getDelta());
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onerror = (msg) => { statusEl.innerText = "Error: " + msg; };

        function pollPose() {
            fetch('/pose')
                .then(res => res.json())
                .then(data => {
                    if (data && data.world && data.norm && currentVrm) {
                        statusEl.innerText = "Tracking Active";
                        
                        try {
                            if (data.world.length === 0) {
                                data.world = data.norm;
                            }
                            
                            let riggedPose = Kalidokit.Pose.solve(data.world, data.norm, {
                                runtime: "mediapipe",
                                video: null 
                            });

                            if (riggedPose) {
                                rigRotation("Hips", riggedPose.Hips.rotation, 0.7);
                                rigPosition("Hips", {
                                    x: -riggedPose.Hips.position.x, 
                                    y: riggedPose.Hips.position.y + 1, 
                                    z: -riggedPose.Hips.position.z 
                                }, 1, 0.07);

                                rigRotation("Chest", riggedPose.Spine, 0.25, .3);
                                rigRotation("Spine", riggedPose.Spine, 0.45, .3);

                                rigRotation("RightUpperArm", riggedPose.RightUpperArm, 1, .3);
                                rigRotation("RightLowerArm", riggedPose.RightLowerArm, 1, .3);
                                rigRotation("LeftUpperArm", riggedPose.LeftUpperArm, 1, .3);
                                rigRotation("LeftLowerArm", riggedPose.LeftLowerArm, 1, .3);

                                rigRotation("LeftUpperLeg", riggedPose.LeftUpperLeg, 1, .3);
                                rigRotation("LeftLowerLeg", riggedPose.LeftLowerLeg, 1, .3);
                                rigRotation("RightUpperLeg", riggedPose.RightUpperLeg, 1, .3);
                                rigRotation("RightLowerLeg", riggedPose.RightLowerLeg, 1, .3);
                                
                                rigRotation("RightHand", riggedPose.RightHand, 1, .3);
                                rigRotation("LeftHand", riggedPose.LeftHand, 1, .3);
                            }
                        } catch (e) {
                            statusEl.innerText = "Kalidokit Error: " + e.message;
                        }
                    }
                    setTimeout(pollPose, 30);
                })
                .catch(err => {
                    setTimeout(pollPose, 500);
                });
        }
        pollPose();

        const rigRotation = (name, rotation = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.3) => {
            if (!currentVrm || !rotation) return;
            const boneName = name.charAt(0).toLowerCase() + name.slice(1);
            const Part = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName[boneName]);
            if (!Part) return;
            
            let euler = new THREE.Euler(rotation.x * dampener, rotation.y * dampener, rotation.z * dampener);
            let quaternion = new THREE.Quaternion().setFromEuler(euler);
            Part.quaternion.slerp(quaternion, lerpAmount); 
        };

        const rigPosition = (name, position = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.3) => {
            if (!currentVrm || !position) return;
            const boneName = name.charAt(0).toLowerCase() + name.slice(1);
            const Part = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName[boneName]);
            if (!Part) return;
            
            // Adjust to scale the movement to the VRM's coordinate space appropriately.
            let vector = new THREE.Vector3(position.x * dampener, position.y * dampener, position.z * dampener);
            Part.position.lerp(vector, lerpAmount); 
        };
    </script>
</body>
</html>
